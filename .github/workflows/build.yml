name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hupi-code
        uses: actions/checkout@v4
        with:
          path: hupi-code

      - name: Check out hupi (for vscode-extension)
        uses: actions/checkout@v4
        with:
          repository: hupi-dev/hupi
          ref: main
          path: hupi

      - name: Install Linux build/runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 \
            rpm bubblewrap socat libsecret-1-dev libx11-dev \
            libasound2t64 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libxss1 xvfb || \
          sudo apt-get install -y -qq \
            pkg-config libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 \
            rpm bubblewrap socat libsecret-1-dev libx11-dev \
            libasound2 libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libxss1 xvfb

      - name: Set up nvm
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.5/install.sh | bash

      - name: Build HUPI Code
        working-directory: hupi-code
        env:
          HUPI_EXTENSION_DIR: ${{ github.workspace }}/hupi/vscode-extension
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          OUT_DIR="${{ github.workspace }}/out" ./build/build.sh

      - name: Smoke test
        working-directory: hupi-code
        run: ./build/smoke-test.sh "${{ github.workspace }}/out/VSCode-linux-x64"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hupi-code-linux-x64
          path: out/VSCode-linux-x64
          retention-days: 7

  # Windows and macOS builds are unsigned — real code signing needs
  # credentials this repo doesn't have wired in yet (a Windows
  # certificate via Azure Trusted Signing, an Apple Developer ID +
  # notarization). Unsigned builds still run fine; the OS will show an
  # "unknown publisher"-style warning on first launch until that's set
  # up. See docs/UPSTREAM_UPGRADES.md and the main README's Phase 4 note.
  #
  # Both jobs are new and unlike linux-x64 (hardened through several real
  # build failures caught by actually running it) haven't been validated
  # against a real build yet — build.sh/smoke-test.sh's win32/darwin
  # paths were written by reasoning through microsoft/vscode's own build
  # source, not by running them. Treat the first real failures here as
  # expected, not a sign the whole approach is wrong.
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out hupi-code
        uses: actions/checkout@v4
        with:
          path: hupi-code

      - name: Check out hupi (for vscode-extension)
        uses: actions/checkout@v4
        with:
          repository: hupi-dev/hupi
          ref: main
          path: hupi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches UPSTREAM_TAG's own .nvmrc pin (see docs/UPSTREAM_UPGRADES.md's
          # "known-bad upstream release" note for why it's pinned at all) —
          # nvm-the-Unix-tool doesn't run on native Windows, so this is the
          # equivalent of the Linux job's nvm install/use for this OS.
          node-version: '24.18.0'

      # Windows Defender's real-time scanning is the single biggest known
      # cause of Windows CI being much slower than Linux/macOS for
      # Node-heavy builds — it scans every file synchronously as npm ci
      # writes tens of thousands of them into node_modules. Excluding the
      # whole workspace (which WORKROOT below is pinned under, so this
      # one exclusion also covers the actual npm ci working directory,
      # not just the checkout) is the standard, well-documented fix.
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      # npm's global cache (~/AppData/Local/npm-cache) holds downloaded
      # package tarballs keyed by content hash, shared across whatever
      # project npm ci runs against — caching it means repeat runs with
      # an unchanged UPSTREAM_TAG skip re-downloading ~1600 packages from
      # the registry, even though npm ci still re-extracts/re-links
      # node_modules fresh each time (this doesn't cache native-module
      # compilation itself, just the download step). A cache miss is
      # harmless — restore/save just no-ops, never fails the build.
      - name: Cache npm global cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-win32-${{ hashFiles('hupi-code/UPSTREAM_TAG') }}
          restore-keys: |
            npm-win32-

      - name: Build HUPI Code
        shell: bash
        working-directory: hupi-code
        env:
          HUPI_EXTENSION_DIR: ${{ github.workspace }}/hupi/vscode-extension
          # Pinned under github.workspace (rather than build.sh's default
          # mktemp -d, which would land somewhere under the system temp
          # dir) so the single Defender exclusion above actually covers
          # where npm ci does its work.
          WORKROOT: ${{ github.workspace }}/workroot
          # VS Code 1.137.0's own preinstall.ts only recognizes VS2022/2019
          # (hardcoded supportedVersions in build/npm/preinstall.ts) and
          # looks for Program Files\Microsoft Visual Studio\<2022|2019>\
          # <SKU>. Diagnostics (vswhere, Get-ChildItem) confirmed
          # windows-latest actually ships "Visual Studio 18" now —
          # Program Files\Microsoft Visual Studio\18\Enterprise — which
          # that hardcoded list doesn't know about, hence "Invalid C/C++
          # Compiler Toolchain" even though a real, current VS install is
          # right there. Two earlier attempts (core.autocrlf=false, then
          # a vs2022_install override guessing the old \2022\Enterprise
          # path) both failed identically because that guessed path
          # doesn't exist either — this is the real path, confirmed live.
          # The override itself only checks fs.existsSync on whatever
          # path you give it, so pointing vs2022_install at the actual
          # VS18 install directory satisfies the check regardless of the
          # version-number mismatch in the variable's own name.
          vs2022_install: C:\Program Files\Microsoft Visual Studio\18\Enterprise
        run: OUT_DIR="${{ github.workspace }}/out" ./build/build.sh

      - name: Smoke test
        shell: bash
        working-directory: hupi-code
        run: ./build/smoke-test.sh "${{ github.workspace }}/out/VSCode-win32-x64"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hupi-code-win32-x64
          path: out/VSCode-win32-x64
          retention-days: 7

      # Not a Store submission — that's still a manual, human step through
      # Partner Center's web UI (see docs/MICROSOFT_STORE.md). This just
      # keeps a ready-to-test .msix available on every push, using the
      # real "HUPI Code" identity already committed in package-msix.sh.
      - name: Package MSIX
        shell: bash
        working-directory: hupi-code
        run: ./build/package-msix.sh "${{ github.workspace }}/out/VSCode-win32-x64" "${{ github.workspace }}/out/hupi-code.msix"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: hupi-code-msix
          path: out/hupi-code.msix
          retention-days: 7

  macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Check out hupi-code
        uses: actions/checkout@v4
        with:
          path: hupi-code

      - name: Check out hupi (for vscode-extension)
        uses: actions/checkout@v4
        with:
          repository: hupi-dev/hupi
          ref: main
          path: hupi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Build HUPI Code
        working-directory: hupi-code
        env:
          HUPI_EXTENSION_DIR: ${{ github.workspace }}/hupi/vscode-extension
        run: OUT_DIR="${{ github.workspace }}/out" ./build/build.sh

      - name: Smoke test
        working-directory: hupi-code
        run: ./build/smoke-test.sh "${{ github.workspace }}/out/VSCode-darwin-arm64"

      # Secrets aren't available to workflow runs triggered by a pull
      # request from a fork (GitHub's own security default), so signing/
      # notarizing only runs for pushes to main and PRs from branches in
      # this same repo — fork PRs still get a full build + smoke test,
      # just an unsigned one, same as before this was wired in.
      - name: Check Apple signing credentials are available
        id: apple_creds
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Code-sign HUPI Code
        if: steps.apple_creds.outputs.available == 'true'
        working-directory: hupi-code
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./build/sign-macos.sh "${{ github.workspace }}/out/VSCode-darwin-arm64"

      - name: Notarize HUPI Code
        if: steps.apple_creds.outputs.available == 'true'
        working-directory: hupi-code
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./build/notarize-macos.sh "${{ github.workspace }}/out/VSCode-darwin-arm64"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hupi-code-darwin-arm64
          path: out/VSCode-darwin-arm64
          retention-days: 7
