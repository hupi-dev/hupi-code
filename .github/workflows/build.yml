name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    # Needed to create/update the "latest" GitHub Release below —
    # GITHUB_TOKEN defaults to read-only content access on this repo.
    permissions:
      contents: write
    steps:
      - name: Check out hupi-code
        uses: actions/checkout@v4
        with:
          path: hupi-code

      - name: Check out hupi (for vscode-extension)
        uses: actions/checkout@v4
        with:
          repository: hupi-dev/hupi
          ref: main
          path: hupi

      - name: Install Linux build/runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 \
            rpm bubblewrap socat libsecret-1-dev libx11-dev \
            libasound2t64 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libxss1 xvfb || \
          sudo apt-get install -y -qq \
            pkg-config libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 \
            rpm bubblewrap socat libsecret-1-dev libx11-dev \
            libasound2 libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libxss1 xvfb

      - name: Set up nvm
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.5/install.sh | bash

      - name: Build HUPI Code
        working-directory: hupi-code
        env:
          HUPI_EXTENSION_DIR: ${{ github.workspace }}/hupi/vscode-extension
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          OUT_DIR="${{ github.workspace }}/out" ./build/build.sh

      - name: Smoke test
        working-directory: hupi-code
        run: ./build/smoke-test.sh "${{ github.workspace }}/out/VSCode-linux-x64"

      # Non-blocking: this is evidence for Store-listing/marketing use
      # (see capture-screenshot.sh's own comment for exactly why it
      # exists), not a correctness check — smoke-test.sh above is what
      # actually gates the build. A screenshot hiccup shouldn't fail CI.
      - name: Capture a screenshot of the running app
        working-directory: hupi-code
        continue-on-error: true
        run: |
          mkdir -p "${{ github.workspace }}/out/screenshots"
          xvfb-run -a --server-args="-screen 0 1600x1000x24" \
            ./build/capture-screenshot.sh \
              "${{ github.workspace }}/out/VSCode-linux-x64" \
              "${{ github.workspace }}/out/screenshots/hupi-code.png"

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hupi-code-screenshot
          path: out/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hupi-code-linux-x64
          path: out/VSCode-linux-x64
          retention-days: 7

      - name: Package tarball
        run: |
          tar -czf "${{ github.workspace }}/out/hupi-code-linux-x64.tar.gz" \
            -C "${{ github.workspace }}/out" VSCode-linux-x64

      # A GitHub Release (not the build artifact above) is the actual
      # public download hupi.dev's /downloads page links to — build
      # artifacts require a GitHub login and expire after 7 days, so
      # they're fine for CI-to-CI or manual debugging but not real
      # distribution. No versioning scheme of hupi-code's own exists yet
      # (UPSTREAM_TAG isn't it — that's microsoft/vscode's version, not
      # this repo's), so this publishes a single rolling "latest"
      # release, updated on every push to main, rather than a numbered
      # one — the same "always current HEAD" model build.yml's own CI
      # already follows for everything else. Not run for pull_request
      # events: a PR build shouldn't overwrite the public download.
      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately NOT --prerelease: GitHub's own "latest release"
          # resolution (which /releases/latest/download/<file> URLs
          # depend on) explicitly excludes prereleases and drafts — a
          # release marked --prerelease would make those stable-looking
          # download URLs 404 forever, since there'd be no non-prerelease
          # release for "latest" to ever resolve to.
          gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create latest --repo "${{ github.repository }}" \
              --title "Latest build" \
              --notes "Automatically updated on every push to main — not a stable numbered release, just the build closest to HEAD. Linux and macOS only; Windows ships via the Microsoft Store (see docs/MICROSOFT_STORE.md)." || true
          gh release edit latest --repo "${{ github.repository }}" \
            --notes "Automatically updated on every push to main (currently ${{ github.sha }}) — not a stable numbered release, just the build closest to HEAD. Linux and macOS only; Windows ships via the Microsoft Store (see docs/MICROSOFT_STORE.md)."
          gh release upload latest --repo "${{ github.repository }}" --clobber \
            "${{ github.workspace }}/out/hupi-code-linux-x64.tar.gz"

  # The raw win32 build itself stays unsigned on purpose — Windows
  # distribution is Microsoft Store-only, not a direct download, since
  # there's no realistic path to a Windows code-signing certificate of
  # our own right now (see the main README's Distribution status
  # section for why Azure Artifact Signing's eligibility requirements
  # rule this out). The .msix built below exists to keep a ready-to-test
  # package available on every push, not as something this repo
  # publishes for direct install.
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out hupi-code
        uses: actions/checkout@v4
        with:
          path: hupi-code

      - name: Check out hupi (for vscode-extension)
        uses: actions/checkout@v4
        with:
          repository: hupi-dev/hupi
          ref: main
          path: hupi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches UPSTREAM_TAG's own .nvmrc pin (see docs/UPSTREAM_UPGRADES.md's
          # "known-bad upstream release" note for why it's pinned at all) —
          # nvm-the-Unix-tool doesn't run on native Windows, so this is the
          # equivalent of the Linux job's nvm install/use for this OS.
          node-version: '24.18.0'

      # Windows Defender's real-time scanning is the single biggest known
      # cause of Windows CI being much slower than Linux/macOS for
      # Node-heavy builds — it scans every file synchronously as npm ci
      # writes tens of thousands of them into node_modules. Excluding the
      # whole workspace (which WORKROOT below is pinned under, so this
      # one exclusion also covers the actual npm ci working directory,
      # not just the checkout) is the standard, well-documented fix.
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      # npm's global cache (~/AppData/Local/npm-cache) holds downloaded
      # package tarballs keyed by content hash, shared across whatever
      # project npm ci runs against — caching it means repeat runs with
      # an unchanged UPSTREAM_TAG skip re-downloading ~1600 packages from
      # the registry, even though npm ci still re-extracts/re-links
      # node_modules fresh each time (this doesn't cache native-module
      # compilation itself, just the download step). A cache miss is
      # harmless — restore/save just no-ops, never fails the build.
      - name: Cache npm global cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-win32-${{ hashFiles('hupi-code/UPSTREAM_TAG') }}
          restore-keys: |
            npm-win32-

      - name: Build HUPI Code
        shell: bash
        working-directory: hupi-code
        env:
          HUPI_EXTENSION_DIR: ${{ github.workspace }}/hupi/vscode-extension
          # Pinned under github.workspace (rather than build.sh's default
          # mktemp -d, which would land somewhere under the system temp
          # dir) so the single Defender exclusion above actually covers
          # where npm ci does its work.
          WORKROOT: ${{ github.workspace }}/workroot
          # VS Code 1.137.0's own preinstall.ts only recognizes VS2022/2019
          # (hardcoded supportedVersions in build/npm/preinstall.ts) and
          # looks for Program Files\Microsoft Visual Studio\<2022|2019>\
          # <SKU>. Diagnostics (vswhere, Get-ChildItem) confirmed
          # windows-latest actually ships "Visual Studio 18" now —
          # Program Files\Microsoft Visual Studio\18\Enterprise — which
          # that hardcoded list doesn't know about, hence "Invalid C/C++
          # Compiler Toolchain" even though a real, current VS install is
          # right there. Two earlier attempts (core.autocrlf=false, then
          # a vs2022_install override guessing the old \2022\Enterprise
          # path) both failed identically because that guessed path
          # doesn't exist either — this is the real path, confirmed live.
          # The override itself only checks fs.existsSync on whatever
          # path you give it, so pointing vs2022_install at the actual
          # VS18 install directory satisfies the check regardless of the
          # version-number mismatch in the variable's own name.
          vs2022_install: C:\Program Files\Microsoft Visual Studio\18\Enterprise
        run: OUT_DIR="${{ github.workspace }}/out" ./build/build.sh

      - name: Smoke test
        shell: bash
        working-directory: hupi-code
        run: ./build/smoke-test.sh "${{ github.workspace }}/out/VSCode-win32-x64"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hupi-code-win32-x64
          path: out/VSCode-win32-x64
          retention-days: 7

      # Not a Store submission — that's still a manual, human step through
      # Partner Center's web UI (see docs/MICROSOFT_STORE.md). This just
      # keeps a ready-to-test .msix available on every push, using the
      # real "HUPI Code" identity already committed in package-msix.sh.
      - name: Package MSIX
        shell: bash
        working-directory: hupi-code
        run: ./build/package-msix.sh "${{ github.workspace }}/out/VSCode-win32-x64" "${{ github.workspace }}/out/hupi-code.msix"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: hupi-code-msix
          path: out/hupi-code.msix
          retention-days: 7

  macos-arm64:
    runs-on: macos-latest
    # Needed to create/update the "latest" GitHub Release below —
    # GITHUB_TOKEN defaults to read-only content access on this repo.
    permissions:
      contents: write
    steps:
      - name: Check out hupi-code
        uses: actions/checkout@v4
        with:
          path: hupi-code

      - name: Check out hupi (for vscode-extension)
        uses: actions/checkout@v4
        with:
          repository: hupi-dev/hupi
          ref: main
          path: hupi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Build HUPI Code
        working-directory: hupi-code
        env:
          HUPI_EXTENSION_DIR: ${{ github.workspace }}/hupi/vscode-extension
        run: OUT_DIR="${{ github.workspace }}/out" ./build/build.sh

      - name: Smoke test
        working-directory: hupi-code
        run: ./build/smoke-test.sh "${{ github.workspace }}/out/VSCode-darwin-arm64"

      # Secrets aren't available to workflow runs triggered by a pull
      # request from a fork (GitHub's own security default), so signing/
      # notarizing only runs for pushes to main and PRs from branches in
      # this same repo — fork PRs still get a full build + smoke test,
      # just an unsigned one, same as before this was wired in.
      - name: Check Apple signing credentials are available
        id: apple_creds
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Code-sign HUPI Code
        if: steps.apple_creds.outputs.available == 'true'
        working-directory: hupi-code
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./build/sign-macos.sh "${{ github.workspace }}/out/VSCode-darwin-arm64"

      - name: Notarize HUPI Code
        if: steps.apple_creds.outputs.available == 'true'
        working-directory: hupi-code
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./build/notarize-macos.sh "${{ github.workspace }}/out/VSCode-darwin-arm64"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hupi-code-darwin-arm64
          path: out/VSCode-darwin-arm64
          retention-days: 7

      # notarize-macos.sh can legitimately exit 0 without having stapled
      # anything (Apple's queue was still "In Progress" past its own
      # bounded wait — see that script's own comments for why it doesn't
      # block on this unbounded). Checking the app itself for a valid
      # ticket, rather than trusting that step's exit code, is the only
      # way to know for sure whether this build is actually safe to
      # publish as a real download.
      - name: Check whether the notarization ticket actually stapled
        id: staple_check
        if: steps.apple_creds.outputs.available == 'true'
        run: |
          if xcrun stapler validate "${{ github.workspace }}/out/VSCode-darwin-arm64/HUPI Code.app"; then
            echo "stapled=true" >> "$GITHUB_OUTPUT"
          else
            echo "stapled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package zip
        if: steps.staple_check.outputs.stapled == 'true'
        run: |
          ditto -c -k --keepParent \
            "${{ github.workspace }}/out/VSCode-darwin-arm64/HUPI Code.app" \
            "${{ github.workspace }}/out/hupi-code-darwin-arm64.zip"

      # Same "latest" rolling release the linux-x64 job publishes to —
      # see that job's own comment for why (no versioning scheme of
      # hupi-code's own yet, GitHub Releases over build artifacts for a
      # durable public download). Gated on staple_check so an
      # unnotarized build never gets published as a real download — one
      # that's merely signed but not notarized would still trip
      # Gatekeeper on any Mac other than the one that built it.
      - name: Publish to the "latest" release
        if: steps.staple_check.outputs.stapled == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately NOT --prerelease: GitHub's own "latest release"
          # resolution (which /releases/latest/download/<file> URLs
          # depend on) explicitly excludes prereleases and drafts — a
          # release marked --prerelease would make those stable-looking
          # download URLs 404 forever, since there'd be no non-prerelease
          # release for "latest" to ever resolve to.
          gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create latest --repo "${{ github.repository }}" \
              --title "Latest build" \
              --notes "Automatically updated on every push to main — not a stable numbered release, just the build closest to HEAD. Linux and macOS only; Windows ships via the Microsoft Store (see docs/MICROSOFT_STORE.md)." || true
          gh release edit latest --repo "${{ github.repository }}" \
            --notes "Automatically updated on every push to main (currently ${{ github.sha }}) — not a stable numbered release, just the build closest to HEAD. Linux and macOS only; Windows ships via the Microsoft Store (see docs/MICROSOFT_STORE.md)."
          gh release upload latest --repo "${{ github.repository }}" --clobber \
            "${{ github.workspace }}/out/hupi-code-darwin-arm64.zip"
